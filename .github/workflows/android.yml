name: Build PolyLingo APK from ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout uploaded ZIP
        uses: actions/checkout@v4
      - name: Extract full source from ZIP
        run: |
          set -euo pipefail
          test -s polylingo_source.zip
          unzip -o -q polylingo_source.zip
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Package APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PolyLingo_AI-debug.apk
          (cd dist && sha256sum PolyLingo_AI-debug.apk > SHA256SUMS.txt)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyLingo-AI-APK
          path: dist/
          if-no-files-found: error
